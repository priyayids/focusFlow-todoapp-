name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Deploy to VPS
      uses: appleboy/ssh-action@v0.1.10
      with:
        host: 187.77.126.196
        username: root
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd /var/www/focusflow
          git pull
          docker compose up -d --build
